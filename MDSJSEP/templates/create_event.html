{% extends 'baseSalas.html' %}

{% block titulo %}Crear Alta{% endblock %}

{% block content %}
<style>
.form-container {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

.form-card {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(105, 28, 50, 0.1);
  overflow: hidden;
  border: none;
}

.form-header {
  background: linear-gradient(135deg, #691c32 0%, #8b1f43 100%);
  color: white;
  padding: 1.5rem 2rem;
  border: none;
}

.form-header h1 {
  font-weight: 700;
  font-size: 1.75rem;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.form-body {
  padding: 2rem;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  font-weight: 600;
  color: #343a40;
  margin-bottom: 0.5rem;
  display: block;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 0.75rem 1rem;
  border: 1px solid #dee2e6;
  border-radius: 8px;
  font-size: 1rem;
  transition: all 0.3s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: #691c32;
  box-shadow: 0 0 0 0.2rem rgba(105, 28, 50, 0.25);
  outline: none;
}

.form-group textarea {
  resize: vertical;
  min-height: 120px;
}

.btn-submit {
  background: linear-gradient(135deg, #691c32 0%, #8b1f43 100%);
  border: none;
  color: white;
  font-weight: 600;
  padding: 0.875rem 2rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  box-shadow: 0 2px 8px rgba(105, 28, 50, 0.2);
  transition: all 0.3s ease;
  width: 100%;
}

.btn-submit:hover {
  background: linear-gradient(135deg, #8b1f43 0%, #691c32 100%);
  color: white;
  box-shadow: 0 4px 12px rgba(105, 28, 50, 0.3);
  transform: translateY(-2px);
}

.alert {
  border-radius: 8px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
  .form-container {
    padding: 1rem;
  }

  .form-header {
    padding: 1.25rem 1.5rem;
  }

  .form-header h1 {
    font-size: 1.5rem;
  }

  .form-body {
    padding: 1.5rem;
  }
}
</style>

<div class="form-container">
  {{ error }}
  
  <div class="form-card">
    <div class="form-header">
      <h1>
        <i class="bi bi-plus-circle-fill"></i>Crear Alta
      </h1>
    </div>
    
    <div class="form-body">
      <form action="{% url 'create_event' %}" enctype="multipart/form-data" method="POST">
        {% csrf_token %}
        
        <div class="form-group">
          <label for="{{ form.titulo.id_for_label }}">
            <i class="bi bi-building me-2"></i>Nombre del Inmueble:
          </label>
          {{ form.titulo }}
        </div>
        
        <div class="form-group">
          <label for="{{ form.descripcion.id_for_label }}">
            <i class="bi bi-text-paragraph me-2"></i>Descripción:
          </label>
          {{ form.descripcion }}
        </div>
        
        <button type="submit" class="btn-submit">
          <i class="bi bi-check-circle me-2"></i>Generar Alta
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
